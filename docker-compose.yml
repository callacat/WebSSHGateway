version: "3.9"
services:
  webssh:
    build: .
    ports:
      - "8080:8080"
    environment:
      # SECRET_KEY must be exactly 16/24/32 bytes. `openssl rand -hex 32` prints a
      # 64-char hex string (64 chars = 32 bytes), which is the recommended length.
      # Replace the example below with your own generated value.
      - SECRET_KEY=c8ab6d4eb00de6a5597f8f7423a6cfff2bcfc5d992a06957df3aab23ea2abcf7
      - DATABASE_URL=sqlite:////data/app.db
      - PORT=8080
      - LOG_LEVEL=INFO
      - SESSION_KEEPALIVE_INTERVAL=60
      - JWT_ISSUER=webssh-gateway
      - JWT_ACCESS_TTL_HOURS=12
      - JWT_REMEMBER_TTL_DAYS=7
      - LOGIN_LOCK_MINUTES=15
      - LOGIN_LOCK_THRESHOLD=5
      - SSH_KNOWN_HOSTS=/data/known_hosts
      - SSH_ALLOW_UNKNOWN_HOSTS=false
      - CORS_ALLOW_ORIGINS=
      - TZ=Asia/Shanghai
    volumes:
      - webssh-data:/data

volumes:
  webssh-data:
