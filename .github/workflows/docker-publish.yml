name: Publish Docker Image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'main') }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

      - name: Notify on build failure
        if: failure()
        shell: bash
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          COMMIT_MSG=$(git log --format=%s -1)
          COMMIT_URL="${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s -o /dev/null \
            "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TG_CHAT_ID}" \
            -d "parse_mode=Markdown" \
            -d "text=🔴 *WebSSH Gateway 构建失败*
提交: [${COMMIT_MSG:0:60}](${COMMIT_URL})
日志: [查看详情](${RUN_URL})"

      - name: Notify on build success
        if: success() && github.event_name != 'pull_request'
        shell: bash
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          COMMIT_MSG=$(git log --format=%s -1)
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s -o /dev/null \
            "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TG_CHAT_ID}" \
            -d "parse_mode=Markdown" \
            -d "text=🟢 *WebSSH Gateway 构建成功*
提交: ${COMMIT_MSG:0:60}
日志: [查看详情](${RUN_URL})"

      - name: Delete old untagged/orphaned package versions
        continue-on-error: true
        shell: bash
        run: |
          REPO="${{ github.repository }}"
          OWNER="${REPO%%/*}"
          PACKAGE="${REPO#*/}"
          TOKEN="${{ secrets.GITHUB_TOKEN }}"
          PACKAGE="${PACKAGE,,}"
          versions=$(curl -s -H "Authorization: Bearer $TOKEN" \
            "https://api.github.com/users/${OWNER}/packages/container/${PACKAGE}/versions?per_page=30")
          orphaned=$(echo "$versions" | jq -r \
            '.[] | select(.metadata.container.tags == null or .metadata.container.tags == []) | .id')
          echo "$orphaned" | tail -n +4 | while read -r id; do
            [ -z "$id" ] && continue
            echo "Deleting orphaned version: $id"
            curl -s -X DELETE -H "Authorization: Bearer $TOKEN" \
              "https://api.github.com/users/${OWNER}/packages/container/${PACKAGE}/versions/$id"
          done
